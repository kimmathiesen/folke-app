<!doctype html><html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baby Søvn">
<meta name="theme-color" content="#0b1224">
<link rel="manifest" href="/manifest.json"><title>Baby Søvn</title>
<style>
:root{--fg:#e9edf8;--mut:#8e9ac0;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--acc:#5b8def;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#0a1022}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.35 -apple-system,system-ui,sans-serif;text-align:center;
background:radial-gradient(120% 60% at 50% 0,#1b2a55 0,#0f1830 45%,#0a1022 100%) fixed;
padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 28px)}
main{max-width:440px;margin:0 auto}
header svg{width:84px;height:84px}
h1{margin:2px 0 4px;font-size:30px;font-weight:600}
.tag{color:var(--mut);font-size:15px}
#ring{position:relative;width:min(72vw,290px);aspect-ratio:1;margin:22px auto}
#ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:7}
.trk{stroke:rgba(255,255,255,.08)}
#arc{stroke:url(#g);stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:578;transition:stroke-dashoffset 1s linear,opacity .6s}
#arc.sl{opacity:.55}
#mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#clock{font-size:clamp(34px,11vw,48px);font-weight:300;font-variant-numeric:tabular-nums}
#state{margin-top:4px;color:var(--mut);font-size:14px}
#btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:240px;padding:18px 34px;border:0;border-radius:99px;
font-size:20px;font-weight:500;color:#fff;background:linear-gradient(90deg,#4f86f0,#6a9bff);box-shadow:0 8px 28px rgba(91,141,239,.35)}
#btn.stop{background:linear-gradient(90deg,#e0685a,#f08a6c);box-shadow:0 8px 28px rgba(224,104,90,.3)}
#btn:disabled{opacity:.5}#btn svg{width:22px;height:22px;fill:#fff}
#type{margin:16px 0 0;display:flex;gap:8px;justify-content:center}
#type button{padding:8px 22px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
#type .on{background:var(--fg);color:#0b1224;border-color:var(--fg)}
.card{margin:16px 0 0;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left}
.row{display:flex;align-items:center;gap:14px}
.ic{width:34px;height:34px;flex:none;stroke:var(--mut);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#pred .ic{width:46px;height:46px}
.t{flex:1;min-width:0}.t b{display:block;font-weight:500}.t span{color:var(--mut);font-size:14px}
input[type=time]{width:112px;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);font-size:17px;text-align:center}
.go{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px}
.big{font-size:26px;font-weight:600;margin:2px 0}
#err{color:#ff8b7e;font-size:14px;margin-top:12px}
.seg{display:flex;gap:8px;margin-top:12px}
.seg button{flex:1;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);font-size:16px}
.seg .on{background:var(--fg);color:#0b1224;border-color:var(--fg)}
.inl{display:flex;gap:10px;align-items:center;margin-top:12px}.inl span{flex:1;color:var(--mut);font-size:14px}
.inl .go{margin:0;width:auto;flex:none;padding:12px 18px}
input[type=number]{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);font-size:17px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.dl{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:500}.dl .ic{width:26px;height:26px}
#dd{color:var(--mut);font-size:14px}
#tl{position:relative;list-style:none;margin:0;padding:0}
#tl::before{content:"";position:absolute;left:6px;top:24px;bottom:24px;width:2px;border-radius:2px;background:linear-gradient(#e0a63c,#3f9be0 40%,#e8814f 70%,#7c6ff0)}
#tl li{position:relative;margin:0 0 10px 22px}
#tl li::before{content:"";position:absolute;left:-20px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--c)}
.pill{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ci{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.ci svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill>div:nth-child(2){flex:1;min-width:0}.tm{font-size:17px;font-variant-numeric:tabular-nums}.lb{color:var(--mut);font-size:14px}
.du{flex:none;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mut);font-size:14px}
.sum{display:flex;justify-content:space-between;margin:6px 4px 0;padding-top:12px;border-top:1px solid var(--line);color:var(--mut)}.sum b{color:var(--fg);font-weight:500}
</style></head><body><main>
<header>
<svg viewBox="0 0 100 100"><path d="M60 14a34 34 0 1 0 25 55A30 30 0 0 1 60 14z" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
<path d="M46 52q3 3 6 0M60 58q3 3 6 0M52 66q3 2 6 0" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
<path d="M82 14l1.8 4.2L88 20l-4.2 1.8L82 26l-1.8-4.2L76 20l4.2-1.8z" fill="#ffe28a"/>
<path d="M18 30l1.3 3L22 34.3 19.3 35.6 18 39l-1.3-3.4L14 34.3 16.7 33z" fill="#ffe28a"/>
<path d="M30 8l1 2.4 2.4 1-2.4 1L30 15l-1-2.6-2.4-1 2.4-1z" fill="#ffe28a"/></svg>
<h1>Baby Søvn</h1><div class="tag">Små drømme, store øjeblikke ♡</div>
</header>
<div id="ring"><svg viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea0ff"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient></defs>
<circle class="trk" cx="100" cy="100" r="92"/><circle id="arc" cx="100" cy="100" r="92"/></svg>
<div id="mid"><div id="clock">--</div><div id="state"></div></div></div>
<button id="btn" disabled>…</button>
<div id="type" hidden><button data-n="1">Lur</button><button data-n="0">Nat</button></div>
<div id="late" class="card"><div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M3 20V6M21 20V6M3 12h18M3 17h18M7 12V9a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/></svg>
<div class="t"><b>Glemte du at trykke?</b><span>Faldt i søvn kl.</span></div><input type="time" id="st"></div><button class="go" id="lb" hidden>Gem</button></div>
<div id="wake" class="card" hidden><div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M3 20V6M21 20V6M3 12h18M3 17h18M7 12V9a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/></svg>
<div class="t"><b>Glemte du at trykke?</b><span>Vågnede kl.</span></div><input type="time" id="wt"></div><button class="go" id="wb" hidden>Gem</button></div>
<div id="pred" class="card" hidden><div class="row"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 11q1.5 1.5 3 0M13 11q1.5 1.5 3 0M10 15.5q2 1.5 4 0"/></svg>
<div class="t"><span id="pk"></span><div class="big" id="pt"></div><span id="sub"></span></div></div></div>
<div id="feed" class="card"><div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M10 3h4M10.5 3v3M13.5 3v3M8 8a3 3 0 0 1 3-2h2a3 3 0 0 1 3 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM8 12h3M8 15h3"/></svg>
<div class="t"><b>Mad</b><span id="lastfeed">Ingen måltider endnu</span></div></div>
<div class="seg" id="fbtns"><button data-k="breast">Amning</button><button data-k="bottle">Flaske</button></div>
<div class="inl" id="fwhen" hidden><span>Tidspunkt (valgfrit)</span><input type="time" id="ft"></div>
<div class="seg" id="fbreast" hidden><button data-s="left">Venstre</button><button data-s="right">Højre</button><button data-s="both">Begge</button></div>
<div id="fbottle" hidden><div class="seg" id="fmilk"><button data-m="breast milk">Modermælk</button><button data-m="formula">Erstatning</button></div>
<div class="inl"><input type="number" id="ml" inputmode="numeric" min="1" max="500" placeholder="ml"><button class="go" id="fgo">Gem flaske</button></div></div></div>
<div id="err"></div>
<div id="day" class="card" hidden><div class="dh"><div class="dl"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Dagens søvn</div><span id="dd"></span></div>
<ul id="tl"></ul><div class="sum"><span>Samlet søvn</span><b id="tot"></b></div></div>
</main><script>
const $=i=>document.getElementById(i);let S=null,napSel=null;
const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',STOP='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
const HALF='<svg viewBox="0 0 24 24"><path d="M6 17a6 6 0 0 1 12 0M3 17h18M12 6v2M4.5 10.5 6 12M19.5 10.5 18 12"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
const TL={n:['#7c6ff0',MOON],m:['#e0a63c',HALF],d:['#3f9be0',SUN],e:['#e8814f',HALF]};
const dur=m=>m<60?`${m} min`:`${m/60|0} t ${m%60} min`;
const CLK='<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const hm=d=>new Date(d).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});
const FM={'bottle':'Flaske','left breast':'Amning, venstre','right breast':'Amning, højre','both breasts':'Amning'};
const ago=d=>{const m=Math.max(0,(Date.now()-new Date(d))/60000|0);return m<60?`${m} min`:`${m/60|0} t ${m%60} min`};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
async function api(p,body){const r=await fetch(p,body===undefined?{}:{method:'POST',
headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const isNap=()=>napSel??S.nap_guess;
async function load(){try{S=await api('/api/status');$('err').textContent='';
if(S.sleeping){$('st').value='';$('lb').hidden=true}else{napSel=null;$('wt').value='';$('wb').hidden=true}}
catch(e){$('err').textContent=e.message}render()}
function render(){if(!S)return;const sl=S.sleeping,p=S.prediction,b=sl?S.since:S.awake_since;let secs=0;
$('state').textContent=sl?'Sover':'Vågen';
if(b){secs=Math.max(0,(Date.now()-new Date(b))/1000|0);const z=n=>String(n).padStart(2,'0');
$('clock').textContent=`${z(secs/3600|0)}:${z(secs/60%60|0)}:${z(secs%60)}`}else $('clock').textContent='--';
const win=p?p.window_min*60:0;
$('arc').style.strokeDashoffset=578*(1-(sl?1:(win&&b?Math.min(1,secs/win):0)));$('arc').classList.toggle('sl',sl);
$('btn').disabled=false;$('btn').className=sl?'stop':'';$('btn').innerHTML=(sl?STOP:PLAY)+(sl?'Stop søvn':'Start søvn');
$('type').hidden=$('wake').hidden=!sl;$('late').hidden=sl;
document.querySelectorAll('#type button').forEach(x=>x.classList.toggle('on',(x.dataset.n==='1')===isNap()));
$('pred').hidden=!p;if(p){$('pk').textContent='Næste '+p.kind;$('pt').textContent='ca. kl. '+hm(p.time);
$('sub').textContent=cap(`vindue ${p.window_min} min · ${p.source}`)}
const lf=S.last_feed;$('lastfeed').textContent=lf?`${FM[lf.method]||lf.method}${lf.amount?' '+Math.round(+lf.amount)+' ml':''} kl. ${hm(lf.time)} · for ${ago(lf.time)} siden`:'Ingen måltider endnu';
$('day').hidden=!S.today.length;
if(S.today.length){let n=0,tot=0;$('dd').textContent=cap(new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'}));
$('tl').innerHTML=S.today.map(x=>{const a=new Date(x.start),m=Math.round((new Date(x.end)-a)/60000),t=a.getHours();tot+=m;
const v=TL[!x.nap?'n':t<11?'m':t<15?'d':'e'];
return `<li style="--c:${v[0]}"><div class="pill"><div class="ci">${v[1]}</div><div><div class="tm">${hm(x.start)} – ${hm(x.end)}</div><div class="lb">${x.nap?'Lur '+(++n):'Nat'}</div></div><span class="du">${dur(m)}</span></div></li>`}).join('');
$('tot').textContent=dur(tot)}}
$('btn').onclick=async()=>{$('btn').disabled=true;
try{await api(S.sleeping?'/api/stop':'/api/start',S.sleeping?{nap:isNap()}:{})}catch(e){$('err').textContent=e.message}load()};
$('st').oninput=()=>$('lb').hidden=!$('st').value;
$('wt').oninput=()=>$('wb').hidden=!$('wt').value;
$('lb').onclick=async()=>{$('lb').disabled=true;
try{await api('/api/start',{since:$('st').value})}catch(e){$('err').textContent=e.message}$('lb').disabled=false;load()};
$('wb').onclick=async()=>{$('wb').disabled=true;
try{await api('/api/stop',{nap:isNap(),wake:$('wt').value})}catch(e){$('err').textContent=e.message}$('wb').disabled=false;load()};
document.querySelectorAll('#type button').forEach(x=>x.onclick=()=>{napSel=x.dataset.n==='1';render()});
let fk=null,fm='breast milk';
function fui(){$('fbreast').hidden=fk!=='breast';$('fbottle').hidden=fk!=='bottle';$('fwhen').hidden=!fk;
document.querySelectorAll('#fbtns button').forEach(x=>x.classList.toggle('on',x.dataset.k===fk));
document.querySelectorAll('#fmilk button').forEach(x=>x.classList.toggle('on',x.dataset.m===fm))}
async function feed(b){try{await api('/api/feed',{...b,at:$('ft').value});fk=null;$('ml').value='';$('ft').value='';fui()}
catch(e){$('err').textContent=e.message}load()}
document.querySelectorAll('#fbtns button').forEach(x=>x.onclick=()=>{fk=fk===x.dataset.k?null:x.dataset.k;fui()});
document.querySelectorAll('#fmilk button').forEach(x=>x.onclick=()=>{fm=x.dataset.m;fui()});
document.querySelectorAll('#fbreast button').forEach(x=>x.onclick=()=>feed({kind:x.dataset.s}));
$('fgo').onclick=()=>{const ml=+$('ml').value;if(!(ml>0)){$('err').textContent='Skriv hvor mange ml';return}feed({kind:'bottle',milk:fm,amount:ml})};
fui();load();setInterval(load,15000);setInterval(render,1000);
</script></body></html>
